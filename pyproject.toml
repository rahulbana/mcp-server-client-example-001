[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-inventory"
version = "0.1.0"
description = "MCP server + client for grocery/fruit inventory with PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    # MCP
    "mcp>=1.9.0",
    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    # Config / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # LLM
    "openai>=1.35.0",
    # Utils
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
inventory-server = "server.main:run"
inventory-client = "client.main:app"

[tool.hatch.build.targets.wheel]
packages = ["server", "client", "shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

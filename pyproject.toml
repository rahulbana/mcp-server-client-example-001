[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-inventory"
version = "0.2.0"
description = "MCP server + client for grocery/fruit inventory with PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    # MCP (includes Streamable HTTP transport)
    "mcp[cli]>=1.9.0",
    # Config / validation (shared by both sides)
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
server = [
    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    # HTTP server
    "uvicorn[standard]>=0.30.0",
]
client = [
    # LLM
    "openai>=1.35.0",
    # CLI
    "rich>=13.7.0",
    "typer>=0.12.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    # Need both sides for tests
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
]
all = [
    "mcp-inventory[server]",
    "mcp-inventory[client]",
]

[project.scripts]
inventory-server = "server.main:run"
inventory-client = "client.main:app"

[tool.hatch.build.targets.wheel]
packages = ["server", "client", "shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
